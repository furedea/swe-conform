[project]
name = "swe-conform"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = "== 3.14.*"
dependencies = [
  "httpx==0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.deptry]
ignore_notebooks = true
known_first_party = [
  "batch_runner",
  "bedrock_responses_client",
  "cache_runner",
  "calibration",
  "codex_cli_client",
  "evidence_export",
  "github_client",
  "guideline",
  "guideline_classifier",
  "guideline_collection",
  "guideline_collection_reports",
  "guideline_evidence",
  "main",
  "markdown_audit",
  "markdown_batch",
  "markdown_batch_lifecycle",
  "markdown_cache_classification",
  "markdown_cache_results",
  "markdown_candidate_extraction",
  "markdown_candidate_store",
  "markdown_classification",
  "markdown_evaluation",
  "markdown_filename_audit",
  "markdown_full_review",
  "markdown_responses_runner",
  "markdown_review",
  "openai_batch_client",
  "openai_responses_client",
  "openrouter_responses_client",
  "pipeline",
  "repository",
  "repository_cache",
  "repository_sampling",
  "repository_tree",
  "repository_workspace",
  "responses_provider",
  "result_store",
]

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 100
sort_by_size = true
exclude = [".venv", "build", "dist"]

[tool.uv]
managed = true
default-groups = ["lint", "typecheck", "test"]
exclude-newer = "1 week"

[dependency-groups]
lint = [
  "ruff==0.15.11",
]
typecheck = [
  "ty==0.0.31",
]
test = [
  "pytest==9.0.3",
  "pytest-mock==3.15.1",
  "pytest-cov==7.1.0",
]
audit = [
  "deptry==0.25.1",
  "vulture==2.16",
]

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]
line-length = 119

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "AIR",
  "FAST",
  "YTT",
  "ANN",
  "ASYNC",
  "B",
  "A",
  "C4",
  "CPY",
  "DTZ",
  "T10",
  "DJ",
  "FIX",
  "FA",
  "INT",
  "LOG",
  "G",
  "PIE",
  "PYI",
  "Q",
  "SLOT",
  "TID",
  "TD",
  "ARG",
  "PTH",
  "FLY",
  "I",
  "NPY",
  "PD",
  "PERF",
  "E",
  "W",
  "DOC",
  "F",
  "PGH",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "UP",
  "FURB",
  "RUF",
  "INP",
]
ignore = [
  "G004",
  "PLC1901",
  "PLR2004",
  "ANN401",
  "ARG002",
  "INP001",
  "PGH004",
  "B008",
  "A002",
  "A003",
  "PLR0913",
  "W191",
  "E111",
  "E114",
  "E117",
]

[tool.ruff.lint.isort]
known-first-party = [
  "batch_runner",
  "bedrock_responses_client",
  "cache_runner",
  "calibration",
  "codex_cli_client",
  "evidence_export",
  "github_client",
  "guideline",
  "guideline_classifier",
  "guideline_evidence",
  "main",
  "markdown_audit",
  "markdown_batch",
  "markdown_batch_lifecycle",
  "markdown_cache_classification",
  "markdown_cache_results",
  "markdown_candidate_extraction",
  "markdown_candidate_store",
  "markdown_classification",
  "markdown_responses_runner",
  "openai_batch_client",
  "openai_responses_client",
  "openrouter_responses_client",
  "pipeline",
  "repository",
  "repository_cache",
  "repository_workspace",
  "responses_provider",
  "result_store",
]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.analysis]
respect-type-ignore-comments = true

[tool.ty.rules]
deprecated = "warn"

invalid-argument-type = "error"
invalid-assignment = "error"
invalid-attribute-access = "error"
invalid-method-override = "error"
invalid-parameter-default = "error"
invalid-return-type = "error"
invalid-type-arguments = "error"

missing-argument = "error"
no-matching-overload = "error"
not-subscriptable = "error"

unresolved-attribute = "error"
unresolved-import = "error"
unresolved-reference = "error"

possibly-missing-attribute = "warn"
possibly-missing-import = "warn"
possibly-unresolved-reference = "warn"

redundant-cast = "warn"
unknown-argument = "warn"
unused-type-ignore-comment = "warn"

[tool.ty.terminal]
error-on-warning = false
